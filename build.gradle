// Updated build configuration for modern Android Gradle Plugin.
plugins {
    id 'com.android.application' version '8.7.3' apply false
}

ext {
    compileSdkVersion = 35
    minSdkVersion = 14
    // Android 15 blocks installation of apps targeting very old SDK levels.
    // API 28 is chosen to retain legacy app behavior while meeting the install floor.
    targetSdkVersion = 28
    SUPPORT_LIBRARY_VERSION = '28.0.0'
}
